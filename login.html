<!DOCTYPE html>
<html lang="es-AR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="robots" content="noindex, nofollow">
    <title>Personal Count — Ingreso</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">
    <link rel="stylesheet" href="assets/css/login.css">

    <link rel="icon" href="assets/logos/jacomunicacion.jpg">
    <link rel="apple-touch-icon" href="assets/logos/jacomunicacion.jpg">
    <meta name="theme-color" content="#12292B">
</head>

<body>
    <!-- Marca de agua: el archivo outline del isotipo, sangrado y en baja opacidad -->
    <div class="watermark" aria-hidden="true">
        <img src="assets/logos/IsoLogojAComunicacion.png" alt="">
    </div>

    <main class="login-card">
        <!-- El isotipo se completa de color mientras se espera la respuesta -->
        <div class="iso" id="iso" role="img" aria-label="jArismendi">
            <span class="iso__base"></span>
            <span class="iso__fill"></span>
        </div>

        <h1 class="login-title">Personal Count</h1>
        <p class="login-sub">Tus finanzas, bajo llave</p>
        <div class="rule" aria-hidden="true"></div>

        <form class="login-form" id="login-form" autocomplete="on">
            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                    autofocus placeholder="••••••••">
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">Entrar</button>
            <p class="login-msg" id="login-msg" role="status" aria-live="polite"></p>
        </form>

        <p class="login-foot">jArismendi®</p>
    </main>

    <script src="assets/js/setup/loginPage.js"></script>
</body>

</html>
